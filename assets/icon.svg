<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Codex Dispatch">
  <!-- 颜色写死，不用 currentColor：图标会被放在浅色和深色两种背景上，
       跟随文字色反而会在某一侧消失。 -->
  <rect width="64" height="64" rx="14" fill="#1E63E9"/>
  <path d="M19 21 L30 32 L19 43" fill="none" stroke="#FFFFFF" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 43 H45" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>
</svg>